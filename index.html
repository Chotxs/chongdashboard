/* --- CSV, copias y descargas --- */
const CSV_HEAD = ['nombre', 'instagram', 'ubicacion', 'ubicacion_tipo', 'vive_sola', 'puntaje', 'dificultad', 'categoria', 'ultimo_encuentro', 'frecuencia_dias', 'planes', 'preferencia', 'estado', 'circulos', 'disponibilidad', 'notas'];
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
function csvCell(v) { const s = String(v ?? ''); return /[",;\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }
function friendsToCsv() {
  const s = st();
  const rows = s.friends.map(f => [f.name, f.instagram ? '@' + f.instagram : '', locText(f), locText(f) ? (f.location.precision === 'exacta' ? 'exacta' : 'aproximada') : '', f.livesAlone ? 'si' : '', Algo.hasRating(f) ? Algo.ratingOf(f) : '', f.difficulty || '', f.category || 'habitual', Algo.lastSeen(f, s.encounters) || '', f.freqDays || 30, (f.plans || []).join('|'), f.meetPref || 'ambos', f.status || 'disponible', (f.circles || []).join('|'), (f.availability || []).join('|'), f.notes || '']);
  return '\uFEFF' + [CSV_HEAD, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
}
function parseCsv(text) {
  text = text.replace(/^\uFEFF/, '');
  const first = text.split(/\r?\n/)[0] || '';
  const sep = (first.match(/;/g) || []).length > (first.match(/,/g) || []).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === sep) { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim() !== ''));
}
function mapList(raw, dict) {
  const entries = Object.entries(dict).map(([k, v]) => [k, norm(typeof v === 'string' ? v : v.label)]);
  return String(raw || '').split(/[|;,]/).map(norm).filter(Boolean).map(x => (entries.find(([k, l]) => norm(k) === x || l === x) || [null])[0]).filter(Boolean);
}
function csvToFriends(text) {
  const rows = parseCsv(text); if (!rows.length) return { items: [], errors: ['El archivo está vacío.'] };
  const head = rows[0].map(norm);
  const idx = k => head.indexOf(k);
  if (idx('nombre') < 0) return { items: [], errors: ['Falta la columna «nombre» en la primera fila.'] };
  const items = [], errors = [];
  const DAYD = Object.fromEntries(Object.entries(Algo.DAY_LABELS).map(([k, v]) => [k, v]));
  rows.slice(1).forEach((r, n) => {
    const g = k => idx(k) >= 0 ? (r[idx(k)] || '').trim() : '';
    const name = g('nombre');
    if (!name) { errors.push(`Fila ${n + 2}: sin nombre, se omite.`); return; }
    let last = g('ultimo_encuentro') || null;
    if (last && /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(last)) { const [d, m, y] = last.split('/'); last = `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`; }
    if (last && (Algo.parseDate(last) == null || last > Algo.todayStr())) { errors.push(`Fila ${n + 2}: fecha «${g('ultimo_encuentro')}» no válida, se deja vacía.`); last = null; }
    const pick1 = (v, opts, def) => opts.includes(norm(v)) ? norm(v) : def;
    const extra = {};
    const rt = parseInt(g('puntaje'), 10);
    if (g('puntaje')) { if (rt >= 1 && rt <= 10) extra.rating = rt; else errors.push(`Fila ${n + 2}: puntaje «${g('puntaje')}» no válido (va de 1 a 10), se deja sin puntaje.`); }
    const df = pick1(g('dificultad'), ['facil', 'dificil'], null);
    const ig = parseInstagram(g('instagram'));
    if (ig) extra.instagram = ig; else if (g('instagram')) errors.push(`Fila ${n + 2}: Instagram «${g('instagram')}» no reconocido, se deja vacío.`);
    const lt = g('ubicacion').slice(0, 120);
    if (lt) extra.location = { text: lt, precision: norm(g('ubicacion_tipo')).startsWith('exact') ? 'exacta' : 'aprox' };
    if (/^(si|s|true|1|x)$/.test(norm(g('vive_sola')))) extra.livesAlone = true;
    if (df) extra.difficulty = df; else if (g('dificultad')) errors.push(`Fila ${n + 2}: dificultad «${g('dificultad')}» no válida (fácil o difícil), se deja sin marcar.`);
    items.push({
      ...extra,
      name: name.slice(0, 60), category: pick1(g('categoria'), ['cercano', 'habitual', 'ocasional'], 'habitual'), lastSeenManual: last,
      freqDays: Math.min(730, Math.max(1, parseInt(g('frecuencia_dias'), 10) || 30)),
      plans: mapList(g('planes'), Algo.PLANS),
      meetPref: pick1(g('preferencia'), ['individual', 'grupal', 'ambos'], 'ambos'), status: pick1(g('estado'), ['disponible', 'excluido', 'archivado'], 'disponible'),
      circles: g('circulos').split(/[|;,]/).map(x => x.trim()).filter(Boolean).slice(0, 10), availability: mapList(g('disponibilidad'), DAYD), notes: g('notas').slice(0, 1000),
    });
  });
  return { items, errors };
}
function pickFile(accept, cb) {
  const inp = document.createElement('input'); inp.type = 'file'; inp.accept = accept; inp.className = 'sr';
  inp.addEventListener('change', () => { const f = inp.files[0]; inp.remove(); if (f) { const r = new FileReader(); r.onload = () => cb(String(r.result), f); r.onerror = () => toast('No se pudo leer el archivo'); r.readAsText(f); } });
  document.body.appendChild(inp); inp.click();
}
function importCsv() {
  pickFile('.csv,text/csv,text/plain', text => {
    const { items, errors } = csvToFriends(text);
    const existing = new Map(st().friends.map(f => [f.name.trim().toLowerCase(), f]));
    const upd = items.filter(i => existing.has(i.name.toLowerCase())), add = items.filter(i => !existing.has(i.name.toLowerCase()));

      render: () => `${items.length ? `<p>Encontré <b>${items.length}</b> ${items.length === 1 ? 'persona' : 'personas'}: ${add.length} nuevas y ${upd.length} que ya tenés (se actualizan sus datos, se mantienen la foto y los encuentros).</p>` : '<p>No encontré personas para importar.</p>'}
        ${errors.length ? `<div class="notice small"><b>Avisos</b><br>${errors.slice(0, 8).map(esc).join('<br>')}${errors.length > 8 ? '<br>…' : ''}</div>` : ''}
        <p class="hint">Columnas: ${CSV_HEAD.join(', ')}. Listas separadas con «|».</p>
        <div class="sheet-foot"><button class="btn ghost" data-a="close-sheet">Cancelar</button><button class="btn primary" data-a="imp-ok" ${items.length ? '' : 'disabled'}>Importar</button></div>`,
      actions: {
        'imp-ok': () => {
          Store.update(s => {
            upd.forEach(i => { const f = s.friends.find(x => x.name.trim().toLowerCase() === i.name.toLowerCase()); if (f) Object.assign(f, i, { lastSeenManual: i.lastSeenManual || f.lastSeenManual, updatedAt: Date.now() }); });
            add.forEach(i => s.friends.push({ ...i, id: uid(), createdAt: Date.now() }));
          });
          closeSheet(); toast(`Importación lista: ${items.length} personas`);
        },
      },

async function offerDownload(filename, data, label) {
  try {
    const type = /\.csv$/i.test(filename) ? 'text/csv' : 'application/json';
    const file = new File([data], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: label }); return; }
    const url = URL.createObjectURL(file), a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000); toast(`${label} guardado`); return;
  } catch (e) {
    if (e && e.name === 'AbortError') return;
    console.warn('download', e);
  }
  openSheet({
    title: label,
    render: () => `<p class="small">Esta vista no permite descargar archivos. Copiá el contenido y guardalo como <b>${esc(filename)}</b>.</p><textarea class="input" id="dl-text" rows="10" readonly>${esc(data.replace(/^\uFEFF/, ''))}</textarea><div class="sheet-foot"><button class="btn primary" data-a="dl-copy">Copiar</button></div>`,
    actions: { 'dl-copy': () => copyText(data.replace(/^\uFEFF/, ''), $('#dl-text')) },
  });
}

    if (!data || data.app !== 'mi-ruleta-social' || !data.state) { toast('Ese archivo no es una copia de Mi Ruleta Social'); return; }

/* ===== Instagram: seguidos/seguidores (exportación oficial) y fotos ===== */
const MAX_FRIENDS = 900; // la base de la cuenta lee hasta 1000 documentos por consulta
const IG_REL = { cf: 'Mejores amigos', mutuo: 'Mutuos', sigo: 'Solo los sigo', meSigue: 'Solo me siguen', todos: 'Todos' };
/** Nombre para mostrar: el de pila del nombre real si Instagram lo trae; si no, deducido del usuario. */
function igContactName(c) {
  const real = c.n ? c.n.split(' ')[0] : '';
  return real.length >= 2 ? real.charAt(0).toUpperCase() + real.slice(1).toLowerCase() : (guessNameFromHandle(c.u) || '@' + c.u);
}
function igRel(c) { return c.fr && c.fg ? 'mutuo' : c.fg ? 'sigo' : 'meSigue'; }
const IG_REL_TAG = { mutuo: 'Mutuo', sigo: 'Lo seguís', meSigue: 'Te sigue' };

function loadScript(src) {
  return new Promise((res, rej) => {
    if ([...document.scripts].some(s => s.src === src)) return res();
    const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('script')); document.head.appendChild(el);
  });
}
function userFromHref(href) {
  const m = String(href || '').match(/instagram\.com\/(?:_u\/)?([A-Za-z0-9._]{1,30})/i);
  return m ? m[1].toLowerCase() : null;
}
/** Recorre el JSON de la exportación y saca usuarios de cada entrada con string_list_data. */
function usersFromIgJson(data) {
  const out = new Set();
  const walk = v => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (!v || typeof v !== 'object') return;
    if (Array.isArray(v.string_list_data)) {
      v.string_list_data.forEach(sld => {
        const u = (sld && typeof sld.value === 'string' && /^[A-Za-z0-9._]{1,30}$/.test(sld.value) ? sld.value.toLowerCase() : null)
          || (typeof v.title === 'string' && /^[A-Za-z0-9._]{1,30}$/.test(v.title) ? v.title.toLowerCase() : null)
          || userFromHref(sld && sld.href);
        if (u) out.add(u);
      });
      return;
    }
    Object.values(v).forEach(walk);
  };
  walk(data);
  return out;
}
function usersFromIgHtml(html) {
  const out = new Set();
  for (const m of String(html).matchAll(/href="https?:\/\/(?:www\.)?instagram\.com\/(?:_u\/)?([A-Za-z0-9._]{1,30})\/?"/gi)) out.add(m[1].toLowerCase());
  return out;
}
/** Instagram guarda los textos con la codificación rota («Ã±» en vez de «ñ»): se repara. */
function fixIgText(t) { try { return decodeURIComponent(escape(t)); } catch (e) { return t; } }
function cleanIgName(n) {
  return fixIgText(String(n || '')).normalize('NFC').replace(/[^\p{L}\p{M}\s'.-]/gu, ' ').replace(/\s+/g, ' ').trim().slice(0, 40);
}
/** Archivos con label_values (Name / Username): devuelve Map usuario → nombre real. */
function namesFromIgJson(data) {
  const out = new Map();
  const walk = v => {
    if (Array.isArray(v)) { v.forEach(walk); return; }
    if (!v || typeof v !== 'object') return;
    if (Array.isArray(v.label_values)) {
      const get = l => (v.label_values.find(x => x && x.label === l) || {}).value;
      const u = String(get('Username') || '').toLowerCase();
      if (/^[a-z0-9._]{1,30}$/.test(u)) out.set(u, cleanIgName(get('Name')));
      return;
    }
    Object.values(v).forEach(walk);
  };
  walk(data);
  return out;
}
/** Qué lista es cada archivo de la exportación, por su nombre. */
function igFileKind(name) {
  const n = name.toLowerCase().split('/').pop();
  if (!/\.(json|html?)$/.test(n)) return null;
  if (/^followers(_\d+)?\./.test(n)) return 'followers';
  if (/^following\./.test(n)) return 'following';
  if (/^close_friends\.json$/.test(n)) return 'close';
  if (/^blocked/.test(n)) return null; // los bloqueados no se usan
  if (/\.json$/.test(n) && /(follow_requests|unfollowed|favorited|hide_story)/.test(n)) return 'names'; // solo para sacar nombres reales
  return null;
}
/** files: FileList de .zip/.json/.html → { followers:Set, following:Set, read:[nombres] } */
async function readIgExport(files) {
  const followers = new Set(), following = new Set(), close = new Set(), names = new Map(), read = [];
  const add = (kind, text, name) => {
    if (kind === 'close' || kind === 'names') {
      const m = namesFromIgJson(JSON.parse(text));
      m.forEach((n, u) => { if (n && !names.has(u)) names.set(u, n); if (kind === 'close') close.add(u); });
      if (kind === 'close') read.push(name.split('/').pop());
      return;
    }
    const set = /\.html?$/i.test(name) ? usersFromIgHtml(text) : usersFromIgJson(JSON.parse(text));
    set.forEach(u => (kind === 'followers' ? followers : following).add(u));
    read.push(name.split('/').pop());
  };
  for (const file of files) {
    if (/\.zip$/i.test(file.name)) {
      if (!window.JSZip) await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
      const zip = await window.JSZip.loadAsync(file);
      for (const entry of Object.values(zip.files)) {
        const kind = !entry.dir && igFileKind(entry.name);
        if (kind) add(kind, await entry.async('string'), entry.name);
      }
    } else {
      const kind = igFileKind(file.name);
      if (kind) add(kind, await file.text(), file.name);
    }
  }
  return { followers, following, close, names, read };
}
function mergeIgContacts(prev, followers, following, close = new Set(), names = new Map()) {
  const map = new Map((prev || []).map(c => [c.u, { u: c.u, fr: 0, fg: 0, ...(c.n ? { n: c.n } : {}) }]));
  // la exportación nueva manda: se recalcula quién sigue a quién
  followers.forEach(u => { const c = map.get(u) || { u, fr: 0, fg: 0 }; c.fr = 1; map.set(u, c); });
  following.forEach(u => { const c = map.get(u) || { u, fr: 0, fg: 0 }; c.fg = 1; map.set(u, c); });
  map.forEach(c => { if (close.has(c.u)) c.cf = 1; const n = names.get(c.u); if (n) c.n = n; });
  return [...map.values()].filter(c => c.fr || c.fg).sort((a, b) => a.u.localeCompare(b.u));
}

/* ===== Exportaciones semanales de Instagram desde Google Drive ===== */
const IG_DRIVE_EVERY = 12 * 3600000; // revisa como mucho cada 12 h
/**
 * Lee de Google Drive las exportaciones de Instagram que todavía no se procesaron y suma sus
 * seguidores y seguidos a los contactos guardados (cada exportación semanal trae solo lo nuevo).
 */
async function syncIgFromDrive() {
  const all = await Drive.listIgExports();
  const prev = st().settings.igDrive || {};
  const seen = new Set(prev.seen || []);
  const key = f => f.id + ':' + (f.modifiedTime || '');
  const fresh = all.filter(f => !seen.has(key(f))).sort((a, b) => (a.modifiedTime || '').localeCompare(b.modifiedTime || ''));
  const before = st().igContacts.list.length;
  if (!fresh.length) {
    Store.update(s => { s.settings.igDrive = { ...(s.settings.igDrive || {}), auto: true, lastCheck: Date.now() }; });
    return { files: 0, found: all.length, added: 0, total: before, failed: [] };
  }
  const followers = new Set(), following = new Set(), close = new Set(), names = new Map(), done = [], failed = [];
  st().igContacts.list.forEach(c => { if (c.fr) followers.add(c.u); if (c.fg) following.add(c.u); if (c.cf) close.add(c.u); if (c.n) names.set(c.u, c.n); });
  for (const f of fresh) {
    try {
      const r = await readIgExport([await Drive.downloadAsFile(f)]);
      r.followers.forEach(u => followers.add(u)); r.following.forEach(u => following.add(u)); r.close.forEach(u => close.add(u));
      r.names.forEach((n, u) => { if (n) names.set(u, n); });
      done.push(key(f));
    } catch (e) {
      if (e && (e.code === 'auth' || e.code === 'network')) throw e;
      failed.push(f.name);
    }
  }
  const list = mergeIgContacts([], followers, following, close, names);
  Store.update(s => {
    if (done.length) s.igContacts = { importedAt: Date.now(), list };
    s.settings.igDrive = { ...(s.settings.igDrive || {}), auto: true, lastCheck: Date.now(), lastSync: done.length ? Date.now() : (s.settings.igDrive || {}).lastSync || null, seen: [...seen, ...done].slice(-300) };
  });
  return { files: done.length, found: all.length, added: list.length - before, total: list.length, failed };
}
function igDriveError(e) {
  const c = e && e.code;
  if (c === 'auth') return 'Tu sesión de Google venció. Volvé a conectar Google en Ajustes.';
  if (c === 'network') return 'Sin conexión a internet. Probá de nuevo.';
  if (c === 'forbidden') return 'Google no dio permiso para leer tu Drive. Volvé a conectar Google y aceptá el permiso de Drive.';
  return 'No se pudo leer Google Drive. Probá de nuevo en un rato.';
}
function igDriveSummary(r) {
  if (!r.found) return 'Todavía no hay exportaciones de Instagram en tu Drive. Cuando llegue la primera, se carga sola.';
  if (!r.files) return `Ya estaba todo al día (${r.total} contactos).${r.failed.length ? ` No pude leer: ${r.failed.join(', ')}.` : ''}`;
  return `Leí ${r.files} ${r.files === 1 ? 'exportación' : 'exportaciones'} de Drive: ${r.total} contactos${r.added > 0 ? ` (${r.added} nuevos)` : ''}.${r.failed.length ? ` No pude leer: ${r.failed.join(', ')}.` : ''}`;
}
function autoIgDrive() {
  const g = st().settings.igDrive || {};
  if (!GAuth.token() || g.auto === false) return;
  if (g.lastCheck && Date.now() - g.lastCheck < IG_DRIVE_EVERY) return;
  syncIgFromDrive().then(r => { if (r.files) toast(igDriveSummary(r)); }).catch(e => console.warn('igDrive', e));
}

    const taken = new Set(s.friends.map(f => f.name.toLowerCase()));
    const add = fs.filter(f => !taken.has(f.name.toLowerCase())); const ids = new Set(add.map(f => f.id));
    s.friends.push(...add); s.encounters.push(...encs.filter(e => e.friendIds.every(x => ids.has(x)))); s.meta.initialized = true;
  });
  toast('Datos de ejemplo cargados');
}
function clearDemo() {
  const ids = st().friends.filter(f => f.isDemo).map(f => f.id);
  removeFriends(ids);
  Store.update(s => { s.encounters = s.encounters.filter(e => !e.isDemo); });
  toast('Datos de ejemplo borrados');
}

/* ===== Despachador de eventos ===== */
const globalActions = {
  'g-in': () => GAuth.signIn(false),
  'g-out': () => confirmSheet({ title: 'Desconectar Google', text: 'Tus datos quedan guardados en este dispositivo y en tu Drive. Dejan de sincronizarse hasta que vuelvas a conectar.', ok: 'Desconectar', onOk: () => { GAuth.signOut(); Store.disconnect(); toast('Google desconectado'); } }),
  'open-ig-import': () => openIgImport(), 'open-ig-contacts': () => { if (topSheet() && topSheet().title === 'Importar de Instagram') closeSheet(); openIgContacts(); }, 'import-photos': () => importPhotos(),
  ...mapActions,
  'close-sheet': () => closeSheet(),
  tab: el => { session.tab = el.dataset.tab; if (el.dataset.seg) session.hseg = el.dataset.seg; if (el.dataset.cseg) session.cseg = el.dataset.cseg; while (sheets.length) closeSheet(); render(); window.scrollTo(0, 0); },
  'open-settings': openSettings, 'open-filters': openFilters, 'open-mood': openFilters, 'open-pick': openPick, 'open-group': openGroup, 'open-weekly': openWeekly,
  'open-friend': el => openFriend(el.dataset.id),
  'new-friend': () => openFriendForm(null),
  'new-encounter': () => openEncounterForm({}),
  'cal-new': el => openEncounterForm({ date: el.dataset.d }),
  'cal-day': el => { session.calDay = el.dataset.d; render(); },
  'cal-move': el => { const [y, m] = (session.calMonth || Algo.todayStr().slice(0, 7)).split('-').map(Number); const d = new Date(Date.UTC(y, m - 1 + Number(el.dataset.v), 1)); session.calMonth = d.toISOString().slice(0, 7); session.calDay = null; render(); },
  'cal-today': () => { session.calMonth = null; session.calDay = null; render(); },
  cseg: el => { session.cseg = el.dataset.v; render(); },
  'plan-new': el => openMeetForm({ date: el.dataset.d || tomorrowStr() }),
  'edit-plan': el => openMeetForm({ kind: 'plan', id: el.dataset.id }),
  'plan-done': el => openMeetForm({ kind: 'plan', id: el.dataset.id }),
  'plan-missed': el => planMissed(el.dataset.id),
  'promise-new': () => openMeetForm({ noDate: true }),
  'edit-promise': el => openMeetForm({ kind: 'prom', id: el.dataset.id }),
  'promise-schedule': el => openMeetForm({ kind: 'prom', id: el.dataset.id, date: tomorrowStr() }),
  'promise-done': el => openMeetForm({ kind: 'prom', id: el.dataset.id, date: Algo.todayStr() }),
  'edit-encounter': el => openMeetForm({ kind: 'enc', id: el.dataset.id }),
  'del-invitation': el => confirmSheet({ title: 'Invitación', text: 'Las invitaciones registran que escribiste, pero no cuentan como encuentro. ¿Querés borrar esta?', ok: 'Borrar', danger: true, onOk: () => Store.update(s => { s.invitations = s.invitations.filter(i => i.id !== el.dataset.id); }) }),
  'dismiss-reminder': () => Store.update(s => { s.settings.reminders.dismissed = Algo.todayStr(); }),
  'weekly-skip': () => Store.update(s => { s.settings.weekly.last = Algo.todayStr(); }),
  ffilter: el => { session.ffilter = el.dataset.v; render(); },
  hseg: el => { session.hseg = el.dataset.v; render(); },
  'wheel-mode': el => { session.result = null; Store.update(s => { s.settings.wheelMode = el.dataset.v; }); },
  spin: () => spin(),
  'round-toggle': el => { const id = el.dataset.id; session.roundExcluded = session.roundExcluded.includes(id) ? session.roundExcluded.filter(x => x !== id) : [...session.roundExcluded, id]; if (session.result?.friendId === id) session.result = null; render(); },
  'round-reset': () => { session.roundExcluded = []; render(); },
  'res-meet': () => { const r = session.result; openEncounterForm({ friendIds: [r.friendId], onSaved: () => setSpinStatus(r.spinId, 'encuentro') }); },
  'res-invite': () => { const r = session.result; session.result = null; addInvitation([r.friendId]); setSpinStatus(r.spinId, 'invitado'); toast(`Anotado: le escribiste a ${friendById(r.friendId).name}`); },
  'res-discard': () => { const r = session.result; session.result = null; setSpinStatus(r.spinId, 'descartado'); toast('Descartado, sin registrar encuentro'); },
  'res-exclude': () => { const r = session.result; session.result = null; session.roundExcluded.push(r.friendId); setSpinStatus(r.spinId, 'descartado'); toast(`${friendById(r.friendId).name} queda fuera de esta ronda`); },
  'clear-spins': () => confirmSheet({ title: 'Borrar historial de giros', text: 'Se borran los resultados de la ruleta. Los encuentros registrados no se tocan.', ok: 'Borrar', danger: true, onOk: () => { session.result = null; Store.update(s => { s.spins = []; }); } }),
  tog: el => el.setAttribute('aria-pressed', el.getAttribute('aria-pressed') !== 'true'),
  seg: el => $$(`[data-group="${el.dataset.group}"]`, el.parentElement).forEach(b => b.setAttribute('aria-pressed', b === el)),
  'export-csv': () => { if (!st().friends.length) { toast('No hay amigos para exportar'); return; } offerDownload(`amigos-${Algo.todayStr()}.csv`, friendsToCsv(), 'Lista de amigos'); },
  'import-csv': importCsv,
  backup: () => offerDownload(`mi-ruleta-social-copia-${Algo.todayStr()}.json`, JSON.stringify({ app: 'mi-ruleta-social', exportedAt: new Date().toISOString(), state: st() }, null, 1), 'Copia de seguridad'),
  restore: restoreBackup,
  'load-demo': loadDemo,
  'clear-demo': () => confirmSheet({ title: 'Borrar datos de ejemplo', text: 'Se borran las personas y encuentros marcados como «demo». Lo que cargaste vos queda intacto.', ok: 'Borrar', danger: true, onOk: clearDemo }),
  wipe: () => confirmSheet({ title: 'Borrar toda la información', text: 'Se eliminan amigos, encuentros, invitaciones, giros y ajustes, en este navegador y en tu cuenta. Si querés conservar algo, hacé antes una copia de seguridad.', ok: 'Borrar todo', danger: true,
    onOk: () => { while (sheets.length) closeSheet(); session.result = null; session.roundExcluded = []; Store.reset(); toast('Se borró toda la información'); } }),
};
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a, sh = topSheet();
  if (el.tagName === 'SUMMARY') { if (sh?.actions?.[a]) sh.actions[a](el, ev); return; }
  if (el.disabled) return;
  if (!el.dataset.nav) ev.preventDefault(); // los links a Instagram siguen abriéndose

  if (sh && sh.el.contains(el) && sh.actions && sh.actions[a]) return sh.actions[a](el, ev);
  if (globalActions[a]) return globalActions[a](el, ev);
});
document.addEventListener('input', ev => {
  const el = ev.target, sh = topSheet();
  if (el.dataset.in === 'fq') { session.fq = el.value; const pos = el.selectionStart; render(); const n = $('#fq'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} } return; }
  if (el.dataset.in === 'en-filter') { const q = el.value.toLowerCase(); $$('[data-a="en-person"]', sh.el).forEach(b => { b.style.display = !q || b.dataset.name.includes(q) || b.getAttribute('aria-pressed') === 'true' ? '' : 'none'; }); return; }
  if (sh && sh.inputs && sh.inputs[el.dataset.in] && el.tagName !== 'SELECT') return sh.inputs[el.dataset.in](el);
  if (el.type === 'range') { const out = $(`[data-out="${el.id}"]`); if (out) out.textContent = el.dataset.chg === 'randomness' ? Math.round(el.value * 100) + '%' : el.value; }
});
document.addEventListener('paste', ev => {
  const sh = topSheet(); if (!sh || !sh.photoInput) return;
  const item = Array.from(ev.clipboardData?.items || []).find(i => i.kind === 'file' && /^image\//.test(i.type));
  if (!item) return;
  const file = item.getAsFile(); if (!file) return;
  ev.preventDefault(); sh.photoInput(file); toast('Foto pegada');
});
document.addEventListener('change', ev => {
  const el = ev.target, sh = topSheet();
  if (el.dataset.in === 'photo') { sh && sh.photoInput && sh.photoInput(el.files[0]); return; }
  if (el.dataset.in === 'ig-export') { if (sh && sh.fileInput && el.files.length) sh.fileInput(Array.from(el.files)); return; }
  if (el.dataset.in === 'fsort') { session.fsort = el.value; render(); return; }
  if (sh && sh.inputs && sh.inputs[el.dataset.in] && el.tagName === 'SELECT') return sh.inputs[el.dataset.in](el);
  if (el.dataset.chg) handleSettingChange(el);
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && sheets.length) closeSheet();
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('g[role="button"][data-a]')) { ev.preventDefault(); ev.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  if (ev.key === 'Enter' && ev.target.id === 'my-loc') { ev.preventDefault(); mapActions['map-me'](); }
});

/* ===== Render principal ===== */
function applyTheme() {
  const t = st().settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
function render() {
  if (session.spinning) return;
  const views = { inicio: viewHome, amigos: viewFriends, ruleta: viewRuleta, calendario: viewCalendar, historial: viewHistory, mapa: viewMapa };
  $('#view').innerHTML = views[session.tab]();
  $$('.nav button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === session.tab ? 'page' : 'false'));
  if (session.tab === 'ruleta') requestAnimationFrame(() => drawWheel(session.angle));
}
function boot() {
  GAuth.capture();
  if (GAuth.renewIfNeeded()) return; // vuelve solo, ya con sesión
  Store.init();
  if (!st().meta.initialized) { Store.update(s => { s.meta.initialized = true; }); loadDemo(); Store.unstamp(); }
  applyTheme();
  $('#nav').innerHTML = `<div class="nav-inner">${[['inicio', 'Inicio', icons.home], ['amigos', 'Amigos', icons.friends], ['ruleta', 'Ruleta', icons.wheel], ['calendario', 'Calendario', icons.calendar], ['mapa', 'Mapa', icons.map], ['historial', 'Historial', icons.history]].map(([k, l, i]) => `<button data-a="tab" data-tab="${k}">${i}<span>${l}</span></button>`).join('')}</div>`;
  Store.subscribe(() => { applyTheme(); render(); refreshLiveSheets(); });
  render();
  Store.connectRemote(() => { session.result = null; }).finally(() => autoIgDrive());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Store.pull(); autoIgDrive(); } });
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  window.addEventListener('resize', () => session.tab === 'ruleta' && drawWheel(session.angle));
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => session.tab === 'ruleta' && drawWheel(session.angle));
}
boot();

</script>
</body>
